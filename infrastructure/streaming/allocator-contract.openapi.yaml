openapi: 3.0.3
info:
  title: GPU allocator boundary (external implementation required)
  version: 1.0.0
paths:
  /sessions:
    post:
      security: [{serviceToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: {type: string, format: uuid}
      responses:
        '200':
          description: Authenticated gateway URL bound to this exact session
          content:
            application/json:
              schema:
                type: object
                required: [signalingUrl]
                properties:
                  signalingUrl: {type: string, format: uri}
        '503': {description: No healthy GPU worker available}
  /sessions/{id}:
    delete:
      security: [{serviceToken: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Worker released; idempotent even when session is already absent}
components:
  securitySchemes:
    serviceToken: {type: http, scheme: bearer}
