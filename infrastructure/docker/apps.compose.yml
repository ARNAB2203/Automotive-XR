services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://automotive:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/automotive
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      SHARE_SIGNING_KEY: ${SHARE_SIGNING_KEY:?Set a generated SHARE_SIGNING_KEY}
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 6
  web:
    environment:
      API_URL: http://api:4000
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_OIDC_ISSUER: ${OIDC_ISSUER:-}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {api: {condition: service_healthy}}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: admin
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_OIDC_ISSUER: ${OIDC_ISSUER:-}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
    ports: ["127.0.0.1:3001:3001"]
    depends_on: {api: {condition: service_healthy}}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
